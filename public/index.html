<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku-Cubo Focus 360</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Sudoku-Cubo</h1>
        <p>Prueba Técnica - Focus 360</p>
    </header>

    <main>
        <section class="controls">
            <button id="btn-load-valid" class="btn secondary">Cargar Válido</button>
            <button id="btn-load-invalid" class="btn secondary">Cargar Inválido</button>
            <div class="divider"></div>
            <button id="btn-validate" class="btn primary">Validar Cubo</button>
            <button id="btn-solve" class="btn accent">Sugerir Corrección</button>
        </section>

        <section class="diagnostic-panel" id="diagnostic-panel">
            <h2>Diagnóstico</h2>
            <div id="diagnostic-content">El cubo aún no ha sido validado.</div>
        </section>

        <section class="cube-container">
            <div class="cube-layout">
                <!-- Top / U -->
                <div class="face-wrapper pos-u">
                    <div class="face-header">
                        <h3>Superior (U)</h3>
                        <div class="rotate-controls">
                            <button class="rotate-btn" data-face="U" data-dir="counterclockwise" title="Rotar Antihorario">↺</button>
                            <button class="rotate-btn" data-face="U" data-dir="clockwise" title="Rotar Horario">↻</button>
                        </div>
                    </div>
                    <div class="face-grid" id="face-U">
                        <!-- 9 inputs will be generated by JS -->
                    </div>
                </div>
                <!-- Left / L -->
                <div class="face-wrapper pos-l">
                    <div class="face-header">
                        <h3>Izquierda (L)</h3>
                        <div class="rotate-controls">
                            <button class="rotate-btn" data-face="L" data-dir="counterclockwise">↺</button>
                            <button class="rotate-btn" data-face="L" data-dir="clockwise">↻</button>
                        </div>
                    </div>
                    <div class="face-grid" id="face-L"></div>
                </div>
                <!-- Front / F -->
                <div class="face-wrapper pos-f">
                    <div class="face-header">
                        <h3>Frontal (F)</h3>
                        <div class="rotate-controls">
                            <button class="rotate-btn" data-face="F" data-dir="counterclockwise">↺</button>
                            <button class="rotate-btn" data-face="F" data-dir="clockwise">↻</button>
                        </div>
                    </div>
                    <div class="face-grid" id="face-F"></div>
                </div>
                <!-- Right / R -->
                <div class="face-wrapper pos-r">
                    <div class="face-header">
                        <h3>Derecha (R)</h3>
                        <div class="rotate-controls">
                            <button class="rotate-btn" data-face="R" data-dir="counterclockwise">↺</button>
                            <button class="rotate-btn" data-face="R" data-dir="clockwise">↻</button>
                        </div>
                    </div>
                    <div class="face-grid" id="face-R"></div>
                </div>
                <!-- Back / B -->
                <div class="face-wrapper pos-b">
                    <div class="face-header">
                        <h3>Posterior (B)</h3>
                        <div class="rotate-controls">
                            <button class="rotate-btn" data-face="B" data-dir="counterclockwise">↺</button>
                            <button class="rotate-btn" data-face="B" data-dir="clockwise">↻</button>
                        </div>
                    </div>
                    <div class="face-grid" id="face-B"></div>
                </div>
                <!-- Down / D -->
                <div class="face-wrapper pos-d">
                    <div class="face-header">
                        <h3>Inferior (D)</h3>
                        <div class="rotate-controls">
                            <button class="rotate-btn" data-face="D" data-dir="counterclockwise">↺</button>
                            <button class="rotate-btn" data-face="D" data-dir="clockwise">↻</button>
                        </div>
                    </div>
                    <div class="face-grid" id="face-D"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
